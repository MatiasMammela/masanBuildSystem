name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.6'

      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o mbs-linux ./

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o mbs.exe ./

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mbs-linux
            mbs.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}